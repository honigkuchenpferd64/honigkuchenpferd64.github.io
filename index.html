<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>honigkuchenpferd64</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  /* ── HERO ─────────────────────────────────────────────── */
  .hero {
    min-height: calc(100vh - 68px);
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 80px 0;
    border-bottom: 1px solid var(--border);
  }

  /* Abstract geometric composition */
  .hero-geo {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .geo-rect-1 {
    position: absolute;
    width: 420px; height: 560px;
    background: var(--accent);
    top: -60px; right: -80px;
    transform: rotate(12deg);
    opacity: 0;
    animation: geoIn1 1.2s cubic-bezier(.16,1,.3,1) .1s forwards;
  }
  .geo-circle-1 {
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    right: 200px; top: 40px;
    opacity: 0;
    animation: geoIn1 1.4s cubic-bezier(.16,1,.3,1) .25s forwards;
  }
  .geo-rect-2 {
    position: absolute;
    width: 120px; height: 120px;
    background: var(--surface);
    right: 360px; top: 120px;
    opacity: 0;
    animation: geoIn1 1s cubic-bezier(.16,1,.3,1) .4s forwards;
  }
  .geo-rect-3 {
    position: absolute;
    width: 280px; height: 8px;
    background: var(--accent);
    opacity: 0.12;
    bottom: 160px; right: 0;
    animation: geoIn1 1.2s ease .6s forwards;
  }
  .geo-circle-2 {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    bottom: 80px; right: 520px;
    animation: geoIn1 .8s ease .5s forwards;
  }
  .geo-rect-4 {
    position: absolute;
    width: 16px; height: 200px;
    background: var(--accent);
    opacity: 0.15;
    bottom: -20px; right: 220px;
    animation: geoIn1 1s ease .7s forwards;
  }

  @keyframes geoIn1 {
    from { opacity: 0; transform: translateY(30px) rotate(var(--r, 0deg)); }
    to   { opacity: var(--o, 1); transform: translateY(0) rotate(var(--r, 0deg)); }
  }
  .geo-rect-1  { --r: 12deg; --o: 0.08; }
  .geo-circle-1 { --r: 0deg; --o: 0.12; }
  .geo-rect-2  { --r: 0deg;  --o: 0.6; }
  .geo-rect-3  { --r: 0deg;  --o: 0.12; }
  .geo-circle-2 { --r: 0deg; --o: 0.1; }
  .geo-rect-4  { --r: 0deg;  --o: 0.15; }

  .hero-content { position: relative; z-index: 2; max-width: 860px; }

  /* Staggered word animation */
  .hero-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    animation: slideUp .7s ease .3s forwards;
  }
  .hero-label-line {
    width: 32px; height: 1.5px;
    background: var(--accent);
    display: inline-block;
  }

  .hero-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(48px, 8vw, 108px);
    color: var(--bright);
    line-height: 0.95;
    letter-spacing: -0.04em;
    margin-bottom: 36px;
    overflow: hidden;
  }
  .hero-title-line {
    display: block;
    overflow: hidden;
  }
  .hero-title-inner {
    display: block;
    opacity: 0;
    transform: translateY(100%);
    animation: lineIn .9s cubic-bezier(.16,1,.3,1) both;
  }
  .hero-title-line:nth-child(1) .hero-title-inner { animation-delay: .4s; }
  .hero-title-line:nth-child(2) .hero-title-inner { animation-delay: .55s; }
  .hero-title-line:nth-child(3) .hero-title-inner { animation-delay: .7s; }

  @keyframes lineIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-tagline {
    font-family: var(--body);
    font-style: italic;
    font-size: clamp(16px, 2vw, 20px);
    color: var(--muted);
    letter-spacing: 0.01em;
    opacity: 0;
    animation: slideUp .7s ease .95s forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .hero-cta {
    display: flex;
    gap: 16px;
    margin-top: 48px;
    flex-wrap: wrap;
    opacity: 0;
    animation: slideUp .7s ease 1.1s forwards;
  }
  .btn-primary {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--bg);
    padding: 12px 28px;
    transition: background .25s, color .25s;
  }
  .btn-primary:hover { background: var(--bright); }
  .btn-ghost {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    padding: 12px 28px;
    transition: background .25s, color .25s;
  }
  .btn-ghost:hover { background: var(--accent); color: var(--bg); }

  /* ── TEASER SECTIONS ────────────────────────────────── */
  .teaser-section { padding: 72px 0; border-bottom: 1px solid var(--border); }

  .teaser-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 2px;
    background: var(--border);
    margin-top: 32px;
  }
  .teaser-card {
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }
  .teaser-card-img {
    aspect-ratio: 4/5;
    overflow: hidden;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .teaser-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .teaser-card:hover .teaser-card-img img { transform: scale(1.05); }
  .teaser-card-info { padding: 16px 20px 20px; border-top: 1px solid var(--border); }
  .teaser-card-ref { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .teaser-card-name { font-family: var(--serif); font-weight: 600; font-size: 18px; color: var(--bright); line-height: 1.2; }

  /* featured article teaser */
  .featured-article {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: var(--border);
    margin-top: 32px;
    cursor: pointer;
    transition: background .2s;
  }
  @media (max-width: 700px) { .featured-article { grid-template-columns: 1fr; } }
  .featured-article:hover .fa-img img { transform: scale(1.04); }
  .fa-img {
    aspect-ratio: 4/3;
    background: var(--surface);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fa-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .fa-body {
    background: var(--bg);
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    transition: background .2s;
  }
  .featured-article:hover .fa-body { background: var(--accent-pale); }
  .fa-meta { display: flex; gap: 12px; align-items: center; }
  .fa-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(22px, 3vw, 34px);
    color: var(--bright);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }
  .fa-excerpt { font-family: var(--body); font-size: 14px; color: var(--muted); line-height: 1.6; }
  .fa-read {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: gap .25s;
  }
  .featured-article:hover .fa-read { gap: 14px; }

  .section-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 24px;
    transition: gap .25s;
  }
  .section-link:hover { gap: 14px; }
</style>

<script src="config.js"></script>
<script>
  // Tagline
  document.getElementById('hero-tagline').textContent = SITE.tagline;

  // ── WATCH TEASER ──────────────────────────────────────────
  const phSvg = `<svg width="60" height="80" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg" class="ph-svg">
    <rect x="18" y="2" width="24" height="8" rx="1" stroke="#233a28" stroke-width="1.5"/>
    <rect x="18" y="70" width="24" height="8" rx="1" stroke="#233a28" stroke-width="1.5"/>
    <circle cx="30" cy="40" r="22" stroke="#233a28" stroke-width="1.5"/>
    <circle cx="30" cy="40" r="3" fill="#233a28"/>
    <line x1="30" y1="22" x2="30" y2="40" stroke="#233a28" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="40" x2="42" y2="40" stroke="#233a28" stroke-width="1.5" stroke-linecap="round"/>
  </svg>`;

  function watchCardHTML(w, badge) {
    return `<div class="teaser-card">
      <div class="teaser-card-img">
        ${w.img
          ? `<img src="${w.img}" alt="${w.name}" loading="lazy">`
          : phSvg}
      </div>
      <div class="teaser-card-info">
        <div class="teaser-card-ref">${w.ref}</div>
        <div class="teaser-card-name">${w.name}</div>
      </div>
    </div>`;
  }

  const teaserWatches = SITE.collection.slice(0, 3);
  document.getElementById('watch-teaser').innerHTML = teaserWatches.map(w => watchCardHTML(w)).join('');

  // ── ARTICLE TEASER ─────────────────────────────────────────
  const a = SITE.articles[0];
  if (a) {
    const dateStr = new Date(a.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('article-teaser').innerHTML = `
      <div class="featured-article" onclick="location.href='article.html?id=${a.id}'">
        <div class="fa-img">${a.img ? `<img src="${a.img}" alt="${a.title}">` : phSvg}</div>
        <div class="fa-body">
          <div class="fa-meta">
            <span class="article-date">${dateStr}</span>
            <span class="article-tag">${a.tag}</span>
          </div>
          <div class="fa-title">${a.title}</div>
          <div class="fa-excerpt">${a.excerpt}</div>
          <span class="fa-read">Read article →</span>
        </div>
      </div>`;
  }

  // ── SCROLL REVEAL ──────────────────────────────────────────
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
