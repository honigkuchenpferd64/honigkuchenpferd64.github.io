<script>
  const phSvg = `<svg width="36" height="36" viewBox="0 0 36 36" fill="none" class="ph-svg">
    <rect x="4" y="4" width="28" height="28" stroke="#233a28" stroke-width="1.5"/>
    <line x1="4" y1="14" x2="32" y2="14" stroke="#233a28" stroke-width="1"/>
    <line x1="12" y1="4" x2="12" y2="32" stroke="#233a28" stroke-width="1"/>
  </svg>`;

  const list = document.getElementById('article-list');
  list.innerHTML = SITE.articles.map(a => {
    const dateStr = new Date(a.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div class="article-item" onclick="location.href='article.html?id=${a.id}'">
        <div class="article-thumb">
          ${a.img
            ? `<img src="${a.img}" alt="${a.title}" loading="lazy">`
            : `<div class="article-thumb-ph">${phSvg}</div>`}
        </div>
        <div class="article-info">
          <div class="article-meta">
            <span class="article-date">${dateStr}</span>
            <span class="article-tag">${a.tag}</span>
          </div>
          <div class="article-title">${a.title}</div>
          <div class="article-excerpt">${a.excerpt}</div>
        </div>
      </div>`;
  }).join('');

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.05 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
