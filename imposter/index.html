<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Imposter – Das Party-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161c;
    --panel: #1c1f28;
    --panel-2: #232733;
    --line: #333849;
    --gold: #d4a24c;
    --gold-dim: #9c7c42;
    --orange: #e2883b;
    --red: #c1443c;
    --text: #eef0f0;
    --muted: #8b8f9c;
    --paper: #f2ead8;
    --paper-ink: #2b2620;
    --green: #4f7a5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .stage{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:24px 20px 32px;
    position:relative;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Special Elite',monospace;
    color:var(--bg);
    font-size:18px;
    flex:none;
  }
  .brand-text{
    font-family:'Special Elite',monospace;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .brand-text span{color:var(--gold);}
  h1{font-family:'Special Elite',monospace; font-size:22px; font-weight:400; margin:0 0 6px; letter-spacing:0.3px;}
  h2{font-family:'Special Elite',monospace; font-size:17px; font-weight:400; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 20px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    transition:transform .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--gold);
    color:#211a0c;
    border:1px solid var(--gold);
  }
  .btn-primary:disabled{
    background:var(--panel-2);
    color:var(--muted);
    border:1px solid var(--line);
    cursor:not-allowed;
  }
  .btn-danger{
    background:transparent;
    color:var(--red);
    border:1px solid rgba(193,68,60,0.4);
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
  }
  .row{display:flex; gap:10px;}
  .grow{flex:1;}
  input[type=text], input[type=number]{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus{
    border-color:var(--gold-dim);
  }
  .player-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .player-chip{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
  }
  .player-chip .num{
    color:var(--muted);
    font-family:'Special Elite',monospace;
    margin-right:10px;
    font-size:13px;
  }
  .remove-btn{
    background:none; border:none; color:var(--muted); font-size:18px;
    cursor:pointer; line-height:1; padding:2px 6px;
  }
  .remove-btn:hover{color:var(--red);}
  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 6px 6px 16px;
  }
  .stepper .val{font-family:'Special Elite',monospace; font-size:20px; min-width:30px; text-align:center;}
  .stepper button{
    width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:18px; cursor:pointer;
  }
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .cat-chip{
    padding:11px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel-2);
    font-size:13.5px;
    text-align:center;
    cursor:pointer;
    color:var(--muted);
    user-select:none;
  }
  .cat-chip.on{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(212,162,76,0.08);
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:4px 2px;
  }
  .switch{
    width:44px;height:26px;border-radius:20px;background:var(--panel-2);
    border:1px solid var(--line);
    position:relative; cursor:pointer; flex:none;
  }
  .switch.on{background:var(--gold-dim); border-color:var(--gold);}
  .switch .knob{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--text); transition:left .15s ease;
  }
  .switch.on .knob{left:20px; background:#211a0c;}
  .label-row{font-size:14px; color:var(--text);}
  .label-row .desc{font-size:12.5px; color:var(--muted); margin-top:2px;}

  .center-flow{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .pass-name{
    font-family:'Special Elite',monospace;
    font-size:30px;
    color:var(--gold);
    margin:10px 0 6px;
  }
  .goofy-tag{
    font-family:'Special Elite',monospace;
    font-size:26px;
    line-height:1.25;
    letter-spacing:0.5px;
    color:var(--red);
    text-transform:uppercase;
    margin-bottom:14px;
    transform:rotate(-3deg);
  }
  .starter-tag{
    font-family:'Special Elite',monospace;
    font-size:16px;
    color:var(--gold);
    text-align:center;
    margin:0 0 4px;
  }
  .progress-dots{display:flex; gap:6px; justify-content:center; margin-bottom:22px;}
  .dot{width:7px;height:7px;border-radius:50%; background:var(--line);}
  .dot.done{background:var(--gold);}
  .dot.active{background:var(--text);}

  .folder-wrap{
    position:relative;
    width:100%;
    max-width:320px;
    height:340px;
    margin:18px auto 8px;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .content{
    position:absolute; inset:0;
    background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 18px;
    color:var(--paper-ink);
  }
  .cover{
    position:absolute; inset:0;
    background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    touch-action:none;
    cursor:grab;
    transform:translateY(0);
  }
  .cover.animate{transition:transform .3s cubic-bezier(.2,.7,.3,1);}
  .cover .hint-text{
    color:var(--muted);
    font-size:13px;
    padding:0 30px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .cover .arrow{font-size:22px; color:var(--gold); animation:bounce 1.6s infinite;}
  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .cover .tab{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    width:56px; height:6px; border-radius:4px;
    background:rgba(255,255,255,0.18);
  }
  .content .role-label{
    font-family:'Special Elite',monospace;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:rgba(43,38,32,0.55);
    margin-bottom:10px;
  }
  .content .secret-word{
    font-family:'Special Elite',monospace;
    font-size:30px;
    line-height:1.25;
    word-break:break-word;
  }
  .content .category-tag{
    margin-top:14px;
    font-size:12.5px;
    color:rgba(43,38,32,0.6);
  }
  .stamp{
    font-family:'Special Elite',monospace;
    font-size:26px;
    color:var(--red);
    border:3px solid var(--red);
    border-radius:8px;
    padding:6px 16px;
    transform:rotate(-8deg);
    letter-spacing:1px;
    opacity:0;
  }
  .content.revealed .stamp{
    animation:stampin .35s ease forwards .05s;
  }
  @keyframes stampin{
    0%{opacity:0; transform:rotate(-8deg) scale(1.6);}
    70%{opacity:1; transform:rotate(-8deg) scale(0.92);}
    100%{opacity:1; transform:rotate(-8deg) scale(1);}
  }
  .reveal-note{color:var(--muted); font-size:13px; margin-top:16px; min-height:18px;}

  .timer-circle{
    width:220px; height:220px;
    display:flex; align-items:center; justify-content:center;
    margin:20px auto;
    position:relative;
  }
  .timer-circle svg{
    position:absolute; inset:0; transform:rotate(-90deg);
  }
  .timer-ring-track{ stroke:var(--panel-2); }
  .timer-ring-progress{
    stroke:var(--orange);
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .3s ease;
  }
  .timer-ring-progress.danger{ stroke:var(--red); }
    position:relative;
  }
  .timer-circle .time{
    font-family:'Special Elite',monospace;
    font-size:42px;
  }
  .results-list{display:flex; flex-direction:column; gap:8px; margin:16px 0 20px;}
  .result-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .result-row.imp{border-color:rgba(193,68,60,0.5);}
  .result-role{
    font-size:12px;
    font-family:'Special Elite',monospace;
    color:var(--muted);
  }
  .result-row.imp .result-role{color:var(--red);}
  .footer-space{height:4px;}
  .bottom-actions{display:flex; flex-direction:column; gap:10px; margin-top:auto; padding-top:18px;}
  .word-reveal-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:16px; text-align:center; margin-bottom:16px;
  }
  .word-reveal-box .w{font-family:'Special Elite',monospace; font-size:24px; color:var(--gold);}
  .small-note{font-size:12px; color:var(--muted); text-align:center; margin-top:10px;}
  ::selection{background:var(--gold); color:#211a0c;}
</style>
</head>

function startGame(){
  const activeCats = Object.keys(CATEGORIES).filter(k => state.categories[k]);
  const catKey = activeCats[Math.floor(Math.random() * activeCats.length)];
  const cat = CATEGORIES[catKey];
  const entry = cat.words[Math.floor(Math.random() * cat.words.length)];

  const indices = state.players.map((_, i) => i);
  shuffle(indices);
  const impostorSet = new Set(indices.slice(0, state.numImposters));

  state.roles = state.players.map((_, i) => impostorSet.has(i) ? "imposter" : "crew");
  state.starterIndex = Math.floor(Math.random() * state.players.length);
  state.word = entry.w;
  state.hint = entry.h;
  state.categoryLabel = cat.label;
  state.revealIndex = 0;
  state.revealStage = "waiting";
  state.timerRemaining = state.discussionSeconds;
  state.timerRunning = false;
  state.screen = "pass";
  render();
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

  }

function setupDrag(coverEl, wrapEl, noteEl){
  const wrapHeight = wrapEl.offsetHeight;
  let startY = null;
  let dragging = false;
  let revealed = state.revealStage === "revealed";

  function setPos(px){
    coverEl.classList.remove("animate");
    coverEl.style.transform = `translateY(${px}px)`;
  }
  function animateTo(px, cb){
    coverEl.classList.add("animate");
    coverEl.style.transform = `translateY(${px}px)`;
    setTimeout(() => { if(cb) cb(); }, 300);
  }

  if(revealed){
    coverEl.style.transform = `translateY(-${wrapHeight}px)`;
    return;
  }
  setPos(0);

  function onDown(e){
    if(revealed) return;
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
  }
  function onMove(e){
    if(!dragging || revealed) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const delta = y - startY;
    const next = Math.min(0, Math.max(-wrapHeight, delta));
    setPos(next);
  }
  function finishReveal(){
    revealed = true;
    state.revealStage = "revealed";
    animateTo(-wrapHeight, () => {
      const contentEl = document.getElementById("content");
      if(contentEl) contentEl.classList.add("revealed");
    });
    noteEl.textContent = "Merk dir alles gut, dann weiter.";
  }
  function onUp(e){
    if(!dragging || revealed) return;
    dragging = false;
    const y = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY);
    const delta = y - startY;
    const finalPos = Math.min(0, Math.max(-wrapHeight, delta));
    if(finalPos < -wrapHeight * 0.32){
      finishReveal();
    } else {
      animateTo(0);
    }
  }

  coverEl.addEventListener("touchstart", onDown, {passive:true});
  coverEl.addEventListener("touchmove", onMove, {passive:true});
  coverEl.addEventListener("touchend", onUp);
  coverEl.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  coverEl.addEventListener("click", () => {
    if(revealed || dragging) return;
    finishReveal();
  });
}

    </div>
    <div class="bottom-actions">
      <button class="btn btn-primary" id="toResults">Rollen aufdecken</button>
    </div>
  `;

  document.getElementById("timerToggle").addEventListener("click", () => {
    state.timerRunning = !state.timerRunning;
    if(state.timerRunning) startTimer(); else stopTimer();
    render();
  });
  document.getElementById("timerReset").addEventListener("click", () => {
    stopTimer();
    state.timerRemaining = state.discussionSeconds;
    state.timerRunning = false;
    render();
  });
  document.getElementById("toResults").addEventListener("click", () => {
    stopTimer();
    state.screen = "results";
    render();
  });

  if(state.timerRunning) startTimer();
}

function startTimer(){
  if(state.timerInterval) return;
  state.timerInterval = setInterval(() => {
    if(state.timerRemaining <= 0){
      stopTimer();
      state.timerRunning = false;
      render();
      return;
    }
    state.timerRemaining -= 1;
    const el = document.getElementById("timeDisplay");
    if(el){
      const mm = Math.floor(state.timerRemaining / 60);
      const ss = state.timerRemaining % 60;
      el.textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
    const ring = document.getElementById("timerRing");
    if(ring){
      const ratio = Math.max(0, Math.min(1, state.timerRemaining / state.discussionSeconds));
      ring.style.strokeDashoffset = TIMER_CIRC * (1 - ratio);
      ring.classList.toggle("danger", state.timerRemaining <= 10);
    }
  }, 1000);
}
function stopTimer(){
  if(state.timerInterval){
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function renderResults(){
  const impCount = state.roles.filter(r => r === "imposter").length;
  app.innerHTML = `
    ${brandHeader()}
    <h1>Auflösung</h1>
    <div class="word-reveal-box">
      <div class="small-note" style="margin-top:0;">Das gesuchte Wort war</div>
      <div class="w">${escapeHtml(state.word)}</div>
      <div class="small-note">Kategorie: ${escapeHtml(state.categoryLabel)}</div>
    </div>
    <p class="sub" style="margin-bottom:8px;">${impCount} Imposter im Spiel:</p>
    <div class="results-list" id="resultsList"></div>
    <div class="bottom-actions">
      <button class="btn btn-primary" id="playAgainBtn">Nochmal spielen (gleiche Spieler)</button>
      <button class="btn btn-ghost" id="newGameBtn">Neue Spielerliste</button>
    </div>
  `;
  const list = document.getElementById("resultsList");
  state.players.forEach((name, i) => {
    const isImp = state.roles[i] === "imposter";
    const row = document.createElement("div");
    row.className = "result-row" + (isImp ? " imp" : "");
    row.innerHTML = `<span>${escapeHtml(name)}</span><span class="result-role">${isImp ? "IMPOSTER" : "MITSPIELER"}</span>`;
    list.appendChild(row);
  });

  document.getElementById("playAgainBtn").addEventListener("click", startGame);
  document.getElementById("newGameBtn").addEventListener("click", () => {
    state.players = [];
    state.screen = "setup";
    render();
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
