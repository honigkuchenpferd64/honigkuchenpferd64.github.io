<link rel="stylesheet" href="style.css" />
<style>
  /* Title word-by-word reveal */
  .title-word {
    display: inline-block;
    overflow: hidden;
    vertical-align: bottom;
  }
  .title-word-inner {
    display: inline-block;
    opacity: 0;
    transform: translateY(110%);
    animation: wordIn .8s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes wordIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Reading progress bar */
  .progress-bar {
    position: fixed;
    top: 68px;
    left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
    z-index: 150;
    transition: width .1s linear;
  }

  /* Geometric side accent on article */
  .article-geo-left {
    position: fixed;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 120px;
    background: var(--accent);
    opacity: 0.15;
  }
  @media (max-width: 960px) { .article-geo-left { display: none; } }

  .article-page-wrap {
    padding-bottom: 80px;
  }

  /* Not found */
  .not-found {
    padding: 120px 0;
    text-align: center;
  }
  .not-found h2 {
    font-family: var(--serif);
    font-size: 48px;
    color: var(--bright);
    margin-bottom: 16px;
  }
  .not-found p { color: var(--muted); }
</style>
</head>

<script src="config.js"></script>
<script>
  const id  = new URLSearchParams(window.location.search).get('id');
  const art = SITE.articles.find(a => a.id === id);
  const root = document.getElementById('article-root');

  if (!art) {
    root.innerHTML = `<div class="wrap not-found">
      <h2>Article not found.</h2>
      <p><a href="articles.html" style="color:var(--accent);">← Back to articles</a></p>
    </div>`;
  } else {
    // Update page title
    document.title = `${art.title} — honigkuchenpferd64`;

    const dateStr = new Date(art.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    // Animate title word by word
    const words = art.title.split(' ').map((w, i) =>
      `<span class="title-word"><span class="title-word-inner" style="animation-delay:${.35 + i * .08}s">${w}</span></span>`
    ).join(' ');

    const bannerHTML = art.img
      ? `<div class="article-banner reveal"><img src="${art.img}" alt="${art.title}"></div>`
      : ``;

    root.innerHTML = `
      <div class="wrap article-page-wrap">
        <a href="articles.html" class="back-link reveal"><span>←</span> All Articles</a>

        <header class="article-header">
          <div class="article-header-meta reveal reveal-d1">
            <span class="article-date">${dateStr}</span>
            <span class="article-tag">${art.tag}</span>
          </div>
          <h1 class="article-header-title">${words}</h1>
        </header>

        ${bannerHTML}

        <div class="article-body reveal">
          ${art.body}
        </div>

        <div style="padding: 40px 0 0; border-top: 1px solid var(--border); margin-top: 24px;">
          <a href="articles.html" class="back-link"><span>←</span> Back to Articles</a>
        </div>
      </div>`;

    // Scroll reveal
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
    }, { threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // Reading progress bar
    window.addEventListener('scroll', () => {
      const doc = document.documentElement;
      const pct = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
      document.getElementById('progress').style.width = pct + '%';
    });
  }
</script>
